    Research Fellowships:
      - name: Pivotal Research Fellow
        summary: Chain-of-thought faithfulness in LLMs, Pivotal Research (London)
        start_date: 2026-02
        end_date: present
        highlights:
          - Selected as a Research Fellow from 2,500+ applicants; awarded a merit-based extension in March 2026.
          - Working with Noah Y. Siegel (Google DeepMind, UK) on chain-of-thought faithfulness.
          - Showed CoT monitors collapse from ~95% to under 11% catch rate on the subset where the reasoning trace is the only signal, and that the attack transfers across monitor families and agent models.

      - name: MARS V Research Fellow
        summary: Steganographic reasoning in LLMs, Meridian (Cambridge, UK)
        start_date: 2026-07
        end_date: present
        highlights:
          - Selected as one of 86 fellows from 1,733 applications (approximately 5%).
          - Working with Julian Schulz on how LLMs hide chain-of-thought in text.
          - Evidence for a distributed mechanism that transfers across encoding schemes by reusing the same weights.

      - name: SPAR Fellow
        summary: Attention Consistency Training for Safety, Kairos
        start_date: 2026-02
        end_date: 2026-05
        highlights:
          - Accepted from a round of nearly 2,500 applications.

    Research:
      - name: The Hypocrisy Gap - Internal Belief vs. CoT via Sparse Autoencoders
        summary: arXiv 2602.02496
        start_date: 2025-11
        end_date: 2026-01
        highlights:
          - Introduced a mechanistic metric quantifying divergence between a model's internal belief and its generated explanation using sparse autoencoders and sparse linear probes.
          - AUROC 0.55-0.74 for detecting sycophantic and hypocritical runs on Gemma, Llama, and Qwen, consistently outperforming a decision-aligned log-probability baseline (0.41-0.50).

      - name: Benchmarking Pluralistic Alignment (PAB)
        summary: ICML 2026 Pluralistic Alignment Workshop
        start_date: 2026-03
        end_date: 2026-06
        highlights:
          - Built the Pluralistic Alignment Benchmark covering 320 scenarios, 8 behavioral-risk categories, and 63 synthetic personas.
          - Evaluated 9 leading LLMs with a multi-judge pipeline, revealing substantial persona-conditioned drift in manipulation, concealment, persuasion, and sycophancy.

      - name: VLM Reliability Probe
        summary: ICLR 2026 Multimodal Intelligence and Multimodal Reasoning Workshops
        start_date: 2025-12
        end_date: 2026-06
        highlights:
          - Cross-family reliability probe testing whether spatial attention structure predicts VLM correctness.
          - Attention coherence has near-zero correlation with accuracy (R approx 0.001); self-consistency is far stronger (R = 0.43).
          - Causal ablations expose a split between late-fusion and early-fusion architectures with direct monitor-design implications.

      - name: COMPASS - Context-Modulated PID Attention Steering
        summary: AAAI 2026 LaMAS Workshop (Oral), arXiv 2511.14776
        start_date: 2025-08
        end_date: 2025-11
        highlights:
          - Interpretable feedback-driven decoding framework steering attention via a Context Reliance Score.
          - Reduced contextual hallucinations by 2.8-5.8 points across HotpotQA, XSum, HaluEval, and RAGTruth without retraining.

      - name: Linear Predictability of Attention Heads
        summary: arXiv 2603.13314
        start_date: 2024-08
        end_date: 2025-05
        highlights:
          - Revealed emergent inter-head linear structure enabling cross-head QKV approximation from 2-5 reference heads.
          - Showed the structure is learned rather than architectural, emerging during pretraining, supported by a theoretical lower bound at initialization.
          - Compressed the KV cache via learned projections for 2x reduction with minimal performance loss.

      - name: ChameleonBench - Quantifying Alignment Faking
        summary: ACML 2025 (Oral)
        start_date: 2025-05
        end_date: 2025-06
        highlights:
          - 800-prompt benchmark across 8 misbehavior categories with an external judge pipeline.
          - Across 6 leading LLMs, up to 20% higher harmful response rates in free-form versus test-like settings.

      - name: ProMoral-Bench - Prompting Strategies for Moral Reasoning and Safety
        summary: NeurIPS 2025 PersonaNLP, arXiv 2602.13274
        start_date: 2025-05
        end_date: 2025-11
        highlights:
          - Benchmark comparing 11 prompting strategies across 4 LLM families, including the new ETHICS-Contrast dataset.
          - Introduced the Unified Moral Safety Score; exemplars outperform multi-hop reasoning on accuracy, safety, and efficiency.

      - name: SAGE - Agentic Framework for Pathology Biomarker Discovery
        summary: arXiv 2602.00953
        start_date: 2025-07
        end_date: present
        highlights:
          - Agentic framework discovering pathology biomarkers grounded in biological literature and multimodal evidence.
          - Links image-derived features with molecular markers and clinical outcomes to improve clinical translatability.

